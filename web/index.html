<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racekalender</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Racekalender">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --panel2: #1f232a; --line: #2a2f37;
    --text: #eef0f3; --muted: #8b93a0; --accent: #ff3b30; --live: #30d158;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(14,16,19,.92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; flex: 1; }
  h1 span { color: var(--accent); }
  button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  button:active { opacity: .7; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; font-size: 13px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip.off { opacity: .38; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2px; margin-top: 8px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; font-size: 13px; padding: 6px 4px; color: var(--muted); }
  .seg button.on { background: var(--panel2); color: var(--text); font-weight: 600; }
  main { padding: 6px 12px calc(env(safe-area-inset-bottom) + 40px); max-width: 720px; margin: 0 auto; }
  .next { margin: 10px 4px 4px; padding: 14px 16px; border-radius: var(--radius);
    background: linear-gradient(135deg, #24161a, #171a1f 60%); border: 1px solid #3a2328; }
  .next small { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  .next b { display: block; font-size: 17px; margin: 2px 0; }
  .next .cd { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .day { margin: 18px 4px 6px; font-size: 13px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }
  .day.today { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.past { opacity: .45; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; padding-top: 1px; }
  .time.wk { font-size: 11px; color: var(--muted); font-weight: 500; line-height: 1.25; }
  .what { min-width: 0; }
  .l1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; color: #fff; letter-spacing: .02em; }
  .sess { font-weight: 600; }
  .sess.race { color: #fff; }
  .l2 { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; margin-top: 6px; padding: 3px 8px;
    border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: #cfd5de; }
  .cls { font-size: 12.5px; color: #cfd5de; margin-top: 4px; }
  .info { display: none; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .row.open .info { display: block; }
  .live { color: var(--live); font-weight: 700; font-size: 11px; letter-spacing: .05em; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); margin-right: 5px; animation: p 1.4s infinite; vertical-align: 1px; }
  @keyframes p { 50% { opacity: .25; } }
  .more { display: block; margin: 14px auto 0; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
  /* sheet */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 10; align-items: flex-end; justify-content: center; }
  .sheet.on { display: flex; }
  .sheet .box { background: var(--panel); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); max-height: 85vh; overflow: auto; border-top: 1px solid var(--line); }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sheet p { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .sub a { color: #fff; background: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .sub span small { display: block; color: var(--muted); font-size: 12px; }
  .copy { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px; }
  /* ── RaceCommunity-huisstijl ─────────────────────────────── */
  :root {
    --bg: #0A0A0A; --panel: #1B1B1B; --panel2: #232323; --line: #262626;
    --text: #F0EDE4; --muted: #8d8d86; --accent: #D9FF43; --live: #D9FF43;
    --radius: 0px; --skew: -14deg;
  }
  html, body { font-family: 'Archivo', 'Bahnschrift', 'Segoe UI', sans-serif; font-feature-settings: "tnum" 1, "lnum" 1;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 48px 48px; background-attachment: fixed; }
  header { background: rgba(10,10,10,.94); border-bottom: 0; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 4px;
    background: linear-gradient(90deg, var(--text) 0 62%, var(--accent) 62% 100%); }
  h1 { display: flex; align-items: center; gap: 0; font-weight: 800; font-size: 19px; letter-spacing: 1px; text-transform: uppercase; }
  h1::before { content: "RC"; display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 36px;
    background: var(--accent); color: #0A0A0A; font-style: italic; font-weight: 800; font-size: 18px; letter-spacing: -.5px;
    transform: skewX(var(--skew)); margin-right: 12px; }
  h1 span { color: var(--accent); }
  button { border-radius: 0; background: var(--panel); }
  #btnSub { background: var(--accent); color: #0A0A0A; border: 0; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
    font-size: 13px; transform: skewX(var(--skew)); padding: 8px 16px; }
  .chip { transform: skewX(var(--skew)); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 1px; text-transform: uppercase; background: var(--panel); }
  .chip i { border-radius: 0; width: 6px; height: 14px; }
  .seg { border-radius: 0; background: var(--panel); }
  .seg button { border-radius: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .seg button.on { background: var(--accent); color: #0A0A0A; }
  .next { background: var(--panel); border: 0; border-left: 8px solid var(--accent); }
  .next small { color: var(--accent); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 3px; }
  .next b { font-weight: 800; }
  .next .cd { color: var(--accent); font-family: 'Barlow Condensed', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .day { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; letter-spacing: 3px; align-items: center; gap: 12px; justify-content: flex-start; }
  .day::after { content: ""; flex: 1; height: 2px; background: var(--line); }
  .card { border: 0; background: transparent; }
  .row { background: var(--panel); border-top: 0; margin-bottom: 4px; grid-template-columns: 62px 1fr; padding: 0 12px 0 0; }
  .row > .time { display: flex; align-items: center; justify-content: center; background: var(--panel2);
    font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; padding: 10px 0; }
  .row > .time.wk { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; text-align: center; }
  .row:has(.sess.race) > .time { background: var(--accent); color: #0A0A0A; }
  .row .what { padding: 10px 0; }
  .tag { border-radius: 0; transform: skewX(var(--skew)); font-size: 12px; }
  .sess { font-weight: 800; }
  .l2 { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; letter-spacing: .5px; }
  .tv { border-radius: 0; background: transparent; border: 0; padding: 0; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  .cls { color: var(--accent); font-family: 'Barlow Condensed', sans-serif; font-size: 16px; letter-spacing: .5px; }
  .live { color: #0A0A0A; background: var(--accent); padding: 1px 6px; }
  .live::before { background: #0A0A0A; }
  .sheet .box { border-radius: 0; border-top: 4px solid var(--accent); }
  .sub a { background: var(--accent); color: #0A0A0A; border-radius: 0; font-weight: 800; transform: skewX(var(--skew)); }
  footer button { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  footer { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Race<span>kalender</span></h1>
    <button id="btnSub">📅 Abonneer</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="seg" id="seg">
    <button data-f="alles">Alles</button>
    <button data-f="kwali">Kwali + races</button>
    <button data-f="races">Races</button>
  </div>
</header>
<main id="main"><div class="empty">Laden…</div></main>

<div class="sheet" id="sheet">
  <div class="box">
    <h2>Abonneren in Agenda</h2>
    <p>Tik op een agenda: je iPhone voegt hem toe als abonnement en werkt hem automatisch bij. Meldingen per agenda zet je aan in de Agenda-app.</p>
    <div id="subs"></div>
    <button id="close" style="margin-top:12px;width:100%">Sluiten</button>
  </div>
</div>

<script>
(() => {
  const TZ = "Europe/Amsterdam";
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("rk." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("rk." + k, JSON.stringify(v)); } catch {} }
  };
  let DATA, hidden = new Set(store.get("hidden", [])), filter = store.get("filter", "alles"), showPast = false;

  const fmt = (o) => new Intl.DateTimeFormat("nl-NL", { timeZone: TZ, ...o });
  const fTime = fmt({ hour: "2-digit", minute: "2-digit" });
  const fDay = fmt({ weekday: "long", day: "numeric", month: "long" });
  const fShort = fmt({ weekday: "short", day: "numeric", month: "short" });
  const dayKey = d => fmt({ year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function parse(s) {
    const st = s.hele_dag ? new Date(s.start + "T00:00:00") : new Date(s.start);
    const en = s.hele_dag ? new Date(s.eind + "T00:00:00") : new Date(s.eind);
    return { ...s, st, en };
  }
  function passes(s) {
    if (hidden.has(s.serie)) return false;
    if (filter === "races") return ["race", "sprint", "weekend"].includes(s.categorie);
    if (filter === "kwali") return s.categorie !== "training";
    return true;
  }
  function relDay(d) {
    const k = dayKey(d), now = new Date();
    if (k === dayKey(now)) return "Vandaag";
    if (k === dayKey(new Date(now.getTime() + 864e5))) return "Morgen";
    return fDay.format(d);
  }
  function countdown(ms) {
    const m = Math.max(0, Math.floor(ms / 6e4)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
    return d ? `${d}d ${h}u` : h ? `${h}u ${mm}m` : `${mm} min`;
  }

  function renderChips() {
    $("#chips").innerHTML = Object.entries(DATA.series).map(([k, s]) =>
      `<button class="chip ${hidden.has(k) ? "off" : ""}" data-k="${k}"><i style="background:${s.kleur}"></i>${esc(s.naam)}</button>`).join("");
    document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  }

  function rowHtml(s, now) {
    const se = DATA.series[s.serie] || { naam: s.serie, kleur: "#666", zender: { kort: "?", info: "" } };
    const live = !s.hele_dag && s.st <= now && s.en > now;
    const past = s.en <= now;
    let time;
    if (s.hele_dag) {
      const last = new Date(s.en.getTime() - 864e5);
      const dagen = Math.round((s.en - s.st) / 864e5);
      time = `<div class="time wk">${s.categorie === "weekend" ? (dagen > 3 ? "event" : "weekend") : "tijd volgt"}<br>${dayKey(last) !== dayKey(s.st) ? "t/m " + fShort.format(last).replace(/\.$/, "") : ""}</div>`;
    } else time = `<div class="time">${fTime.format(s.st)}</div>`;
    const isRace = ["race", "sprint"].includes(s.categorie);
    return `<div class="row ${past ? "past" : ""}" data-open>
      ${time}
      <div class="what">
        <div class="l1"><span class="tag" style="background:${se.kleur}">${esc(se.naam)}</span>
          <span class="sess ${isRace ? "race" : ""}">${esc(s.sessie)}${s.tbc && !s.hele_dag ? " (tijd volgt)" : ""}</span>
          ${live ? '<span class="live">LIVE</span>' : ""}</div>
        <div class="l2">${esc(s.evenement)}${s.locatie && s.locatie !== s.evenement ? " · " + esc(s.locatie) : ""}</div>
        ${s.klassen ? `<div class="cls">🏎️ ${esc(s.klassen)}</div>` : ""}
        <div class="tv">📺 ${esc(se.zender.kort)}</div>
        <div class="info">${esc(se.zender.info)}${s.ronde ? " · Ronde " + s.ronde : ""}${s.notitie ? "<br>ℹ️ " + esc(s.notitie) : ""}</div>
      </div></div>`;
  }

  function render() {
    renderChips();
    const now = new Date();
    const all = DATA.sessies.filter(passes);
    const list = all.filter(s => showPast || s.en > now || (s.hele_dag && s.en > now));
    const nextRace = all.find(s => !s.hele_dag && ["race", "sprint"].includes(s.categorie) && s.st > now);
    let html = "";
    if (nextRace) {
      const se = DATA.series[nextRace.serie];
      html += `<div class="next"><small>Volgende race</small>
        <b>${esc(se.naam)} · ${esc(nextRace.sessie)} – ${esc(nextRace.evenement)}</b>
        <span class="cd">over ${countdown(nextRace.st - now)}</span> · ${relDay(nextRace.st).toLowerCase()} ${fTime.format(nextRace.st)} · 📺 ${esc(se.zender.kort)}</div>`;
    }
    if (!list.length) html += `<div class="empty">Geen sessies voor deze selectie.</div>`;
    let cur = null, buf = "", count = 0, truncated = false;
    const flush = () => { if (cur) html += `<div class="day ${cur.today ? "today" : ""}"><span>${cur.label}</span></div><div class="card">${buf}</div>`; };
    for (const s of list) {
      const k = dayKey(s.st);
      if (!cur || cur.k !== k) {
        if (count >= 45 && !showAll) { truncated = true; break; }
        flush(); buf = ""; count++;
        cur = { k, label: relDay(s.st), today: k === dayKey(now) };
      }
      buf += rowHtml(s, now);
    }
    flush();
    if (truncated) html += `<button class="more" id="more">Meer laden</button>`;
    html += `<footer><button id="past">${showPast ? "Verberg" : "Toon"} afgelopen sessies</button><br><br>
      Bijgewerkt ${fShort.format(new Date(DATA.bijgewerkt))} ${fTime.format(new Date(DATA.bijgewerkt))} · alle tijden NL-tijd</footer>`;
    $("#main").innerHTML = html;
  }
  let showAll = false;

  function renderSubs() {
    if (window.__RACEDATA__) { $("#subs").innerHTML = '<p>Dit is een voorbeeld. Abonneren werkt zodra de kalender op je eigen GitHub Pages-adres staat.</p>'; return; }
    const base = new URL(".", location.href);
    const web = p => base.protocol.startsWith("http") ? "webcal://" + new URL(p, base).href.replace(/^https?:\/\//, "") : p;
    const item = (title, sub, p) => `<div class="sub"><span>${esc(title)}<small>${esc(sub)}</small></span>
      <span><button class="copy" data-url="${new URL(p, base).href}">kopieer</button> <a href="${web(p)}">Abonneer</a></span></div>`;
    let h = item("Alles", "alle series en sessies", "alles.ics") + item("Alleen races", "races, sprints en raceweekenden", "races.ics");
    for (const [k, s] of Object.entries(DATA.series)) if (s.ics) h += item(s.naam, "📺 " + s.zender.kort, s.ics);
    $("#subs").innerHTML = h;
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-open]");
    if (!t) return;
    if (t.matches(".chip")) { const k = t.dataset.k; hidden.has(k) ? hidden.delete(k) : hidden.add(k); store.set("hidden", [...hidden]); render(); }
    else if (t.matches("#seg button")) { filter = t.dataset.f; store.set("filter", filter); render(); }
    else if (t.id === "past") { showPast = !showPast; render(); }
    else if (t.id === "more") { showAll = true; render(); }
    else if (t.id === "btnSub") { renderSubs(); $("#sheet").classList.add("on"); }
    else if (t.id === "close") $("#sheet").classList.remove("on");
    else if (t.matches(".copy")) { navigator.clipboard?.writeText(t.dataset.url).then(() => { t.textContent = "gekopieerd ✓"; }, () => {}); }
    else if (t.matches("[data-open]")) t.classList.toggle("open");
  });
  $("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.classList.remove("on"); });

  function load(d) { DATA = d; DATA.sessies = d.sessies.map(parse); render(); setInterval(render, 60000); }
  if (window.__RACEDATA__) load(window.__RACEDATA__);
  else fetch("races.json", { cache: "no-cache" }).then(r => r.json()).then(load)
    .catch(() => { $("#main").innerHTML = '<div class="empty">Kon races.json niet laden.</div>'; });
})();
</script>
</body>
</html>

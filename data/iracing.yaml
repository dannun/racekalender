      - { naam: "USF2000 · Super Session 1", tijd: 2026-11-21T18:00Z, klassen: "USF2000" }
      - { naam: "GT4 · Super Session 1", tijd: 2026-11-21T19:00Z, klassen: "GT4 (Aston Martin, BMW M4 G82 Evo, Mustang, McLaren 570S, Mercedes-AMG, Porsche 718)" }
      - { naam: "Renault Clio · Super Session 1", tijd: 2026-11-21T20:00Z, klassen: "Renault Clio" }
      - { naam: "Formula Vee · Super Session 2", tijd: 2026-11-22T02:00Z, klassen: "Formula Vee (Classic, Conqueror, Sabre)" }
      - { naam: "Spec Racer Ford · Super Session 2", tijd: 2026-11-22T03:00Z, klassen: "Spec Racer Ford" }
      - { naam: "Mazda MX-5 · Super Session 2", tijd: 2026-11-22T04:00Z, klassen: "Global MX-5 Spec Miata" }
      - { naam: "USF2000 · Super Session 2", tijd: 2026-11-22T05:00Z, klassen: "USF2000" }
      - { naam: "GT4 · Super Session 2", tijd: 2026-11-22T06:00Z, klassen: "GT4 (Aston Martin, BMW M4 G82 Evo, Mustang, McLaren 570S, Mercedes-AMG, Porsche 718)" }
      - { naam: "Renault Clio · Super Session 2", tijd: 2026-11-22T07:00Z, klassen: "Renault Clio" }


# iRacing Special Events – details per event (bron: https://www.iracing.com/specialevents/
# en de wekelijkse iRacing-nieuwsberichten). Het script leest de datums automatisch van
# iracing.com en vult ze aan met wat hier staat (gekoppeld op naam of startdatum).
# Events die hier staan maar niet op de site, komen er ook in.
#
# Velden per event:
#   naam, van, tot          verplicht (JJJJ-MM-DD)
#   circuit                 optioneel
#   klassen                 optioneel, bijv. "GT3 · GT4"
#   duur                    racelengte, bijv. 4h / 12h (voor de eindtijd)
#   slots                   starttijden van de timeslots in UTC/GMT ("2026-12-18T22:00Z")
#   super_session           starttijd van de Super Session (UTC/GMT)
#   sessies                 losse sessies: [{ naam, tijd (UTC), klassen?, duur? }]
#   periode                 naam voor een meerdaags item naast de sessies, bijv. "Kwalificatieraces"
#   notitie                 komt in de agenda-notitie, bijv. "tijden verwacht, nog niet bevestigd"
#
# Vul de 2027-kalender aan zodra iRacing die publiceert (meestal in december).
events:
  - naam: SCCA Runoffs
    van: 2026-11-17
    tot: 2026-11-21
    circuit: Road America
    klassen: Formula Vee · Spec Racer Ford · MX-5 · USF2000 · GT4 · Renault Clio
    periode: Kwalificatieraces
    notitie: "Road America Full Course · licentie Rookie 4.0+. Kwalificatieraces vanaf dinsdagavond (VS-tijd); finale in twee Super Sessions (3 min warm-up, 8 min kwalificatie, 35 min race)."
    duur: 46m
    sessies:
